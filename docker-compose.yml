# ============================================================================
#  AMBIORIX — multi-stage network-pivoting CTF  (BSides Limburg)
#
#  frontier 172.20.0.0/24   player entry ("Roman frontier") — pivot lives here
#  internal 10.10.10.0/24   internal: true -> no external route ("hidden camp")
#
#  your own machine ── pivot(castra) ── internal ── target(arduenna)
#  The player MUST tunnel through `castra` to reach `arduenna`.
#
#  Players attack from THEIR OWN machine (Kali, etc.). The pivot's web + SSH are
#  published to the host; the target is never published. Nothing to scale — each
#  player's SSH -D tunnel binds on their own box, so no :1080 collisions.
#
#    docker compose up -d --build
#      -> http://<host>:8080        (web console, the foothold surface)
#      -> ssh scout@<host> -p 2022  (pivot SSH, after you find the creds)
# ============================================================================
services:

  pivot:
    build: ./pivot
    container_name: ambiorix-castra
    hostname: castra
    networks:
      frontier:
        ipv4_address: 172.20.0.10
      internal:
        ipv4_address: 10.10.10.5
    ports:
      - "8080:80"                       # web console (the foothold surface)
      - "2022:22"                       # pivot SSH (for the SSH -D dynamic forward)
    restart: unless-stopped

  target:
    build: ./target
    container_name: ambiorix-arduenna
    hostname: arduenna
    networks:
      internal:
        ipv4_address: 10.10.10.10
    restart: unless-stopped

networks:
  frontier:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24
  internal:
    driver: bridge
    internal: true          # no route to the outside world
    ipam:
      config:
        - subnet: 10.10.10.0/24
